visible_hostname pi-proxy
http_port 3128

# Only the internal pi-egress network may talk to us. Its subnet is pinned in
# docker-compose.yml, so this can be exact instead of all of RFC1918 — requests
# arriving on the proxy's outbound leg don't match and are denied.
acl localnet src 172.28.167.0/24
acl CONNECT method CONNECT

# Your inference server. Both files are generated at container start from
# PI_BASE_URL into a directory the unprivileged squid user can write; exactly
# one of them ends up meaningful, the other holds an unroutable placeholder
# (squid treats an empty acl file as a fatal error).
acl inference_ip  dst       "/var/lib/squid/acl/inference-ip.txt"
acl inference_dom dstdomain "/var/lib/squid/acl/inference-dom.txt"

# The allowlists, bind-mounted read-only from the host. A leading dot matches
# the domain and all subdomains.
acl allowed       dstdomain "/etc/squid/allowlist.txt"
acl allowed_local dstdomain "/etc/squid/allowlist.local.txt"

acl TLS_ports port 443

http_access deny !localnet

# The inference server is pinned by destination, so any port is fine here --
# it covers a plain-HTTP endpoint on :11666 and an HTTPS one alike.
http_access allow localnet inference_ip
http_access allow localnet inference_dom
http_access allow localnet CONNECT inference_ip
http_access allow localnet CONNECT inference_dom

# Everything else: allowlisted hostnames only, and TLS tunnels only to :443.
http_access allow localnet CONNECT allowed TLS_ports
http_access allow localnet CONNECT allowed_local TLS_ports
http_access allow localnet allowed
http_access allow localnet allowed_local

http_access deny all

# A caching proxy in front of a package registry is a debugging trap. Don't.
cache deny all

# Deliberately NO `hosts_file /etc/hosts`. It preloads /etc/hosts into squid's
# ipcache as permanent entries, which shadows DNS entirely. On Docker Desktop,
# /etc/hosts carries an IPv6-only entry for host.docker.internal (fdc4:...::254)
# while the embedded DNS at 127.0.0.11 serves a usable A record (192.168.65.254).
# Preloading the hosts file therefore pins squid to an address it cannot route to.
#
# Both bridges are IPv4-only, so an AAAA answer is a dead end. Squid prefers IPv6
# by default; flip that so the A record wins.
dns_v4_first on

# Works only because the container runs as `squid` from PID 1 and never setuids;
# see the comment in the Dockerfile.
access_log stdio:/dev/stdout combined
cache_log stdio:/dev/stderr

# Reload the allowlist with SIGHUP (`./pi-allow --reload`), so no pid file is
# needed. `squid -k reconfigure` would need one and cannot work without it.
pid_filename none
shutdown_lifetime 1 seconds

# Don't leak the client's address upstream. `via off` makes squid warn that HTTP
# would rather it sent a Via header; the warning is expected and harmless.
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
